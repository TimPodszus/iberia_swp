stages:
  - build
  - test
  - deploy

variables:
  MAVEN_CLI_OPTS: "--batch-mode"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  paths:
    - .m2/repository

build-job:
  stage: build
  before_script:
    - echo "Setting up Docker..."
    - docker info
  script:
    - echo "Starting Maven build for all modules..."
    - mvn $MAVEN_CLI_OPTS clean install -DskipTests
  artifacts:
    paths:
      - target/
    expire_in: 2 days

unit-test-job:
  stage: test
  before_script:
    - echo "Setting up Docker..."
    - docker info
  script:
    - echo "Running unit tests across all modules..."
    - mvn $MAVEN_CLI_OPTS verify
  artifacts:
    when: always
    paths:
      - target/
    expire_in: 2 days
    reports:
      junit: "**/target/surefire-reports/*.xml"
  coverage: '/Total\s+coverage:\s+(\d+\.\d+)%/'

deploy-job:
  stage: deploy
  before_script:
    - echo "Setting up Docker..."
    - docker info
  script:
    - echo "Deploying the application..."
    - docker login
    - docker build -t timpodszus/iberia-swp server/.
    - docker push timpodszus/iberia-swp
    - docker build -t timpodszus/iberia-db .
    - docker push timpodszus/iberia-db